[project]
name = "toolkit"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pip==26.2.1",
    "pytest==9.1.1",
    "typer==0.27.2",
    "uv==0.12.17",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]